[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "denmark"
dynamic = ["version"]
description = "Density-dependent marked point process models (DenMark) for single-cell resolution spatial transcriptomics."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [
    { name = "Mingchi Xu" },
    { name = "Alexandra M. Schmidt" },
    { name = "Qihuang Zhang", email = "qihuang.zhang@mcgill.ca" },
]
maintainers = [
    { name = "Qihuang Zhang", email = "qihuang.zhang@mcgill.ca" },
]
keywords = [
    "spatial transcriptomics",
    "marked point process",
    "cell density",
    "density-correlated genes",
    "Gaussian process",
    "Stan",
    "bioinformatics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
    "scipy>=1.7",
    "cmdstanpy>=1.2",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.5"]
boundary = ["shapely>=2.0"]
test = ["pytest>=7.0", "shapely>=2.0"]

[project.urls]
Homepage = "https://stagill.github.io/DenMark/"
Documentation = "https://stagill.github.io/DenMark/"
Repository = "https://github.com/StaGill/DenMark"
Issues = "https://github.com/StaGill/DenMark/issues"

[tool.setuptools.dynamic]
version = { attr = "denmark.__version__" }

[tool.setuptools.packages.find]
include = ["denmark*"]

[tool.setuptools.package-data]
denmark = ["stan/*.stan", "data/*.csv.gz"]
